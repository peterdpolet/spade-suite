server {
    listen 80;

    # WebSocket traffic → Daphne (ASGI). Real consumers land in Module 9,
    # but the routing itself is correct from Module 1 — see the
    # Nginx+Gunicorn+Daphne Foundations guide for why these three headers
    # specifically are required, not optional.
    location /ws/ {
        proxy_pass http://daphne:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # API traffic → Gunicorn (WSGI)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Everything else → the built Vue SPA
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
