services:
  db:
    image: postgres:16-alpine
    container_name: miniapp_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-miniapp}
      POSTGRES_USER: ${DB_USER:-miniapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - miniapp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-miniapp}"]
      interval: 2s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: miniapp_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    container_name: miniapp_backend
    restart: always
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  daphne:
    build: ./backend
    container_name: miniapp_daphne
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build: ./frontend
    container_name: miniapp_frontend
    restart: always
  nginx:
    image: nginx:alpine
    container_name: miniapp_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - daphne
      - frontend
volumes:
  miniapp_postgres_data:
